# Publishes Card-iOS to CocoaPods trunk.
#
# Runs on a GitHub macOS runner with Xcode 16, because newer Xcode versions only build for
# iOS 15+ and fail `pod trunk push` validation on the dependencies' lower deployment targets.
#
# Triggered by pushing a version tag (ex 1.0.8), or manually for an existing tag.
# Needs the COCOAPODS_TRUNK_TOKEN repository secret (the trunk.cocoapods.org password in ~/.netrc).

name: Publish CocoaPod

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, ex 1.0.7'
        required: true

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Check podspec version matches the tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION=$(grep -E "s.version\s*=" Card-iOS.podspec | sed -E "s/.*'(.*)'.*/\1/")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match podspec version $VERSION"
            exit 1
          fi

      # Trunk sometimes times out on its GitHub commit after the version is already registered,
      # and rejects a re-run as a duplicate. In both cases check trunk itself before failing.
      - name: Push to trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          LANG: en_US.UTF-8
        run: |
          VERSION=$(grep -E "s.version\s*=" Card-iOS.podspec | sed -E "s/.*'(.*)'.*/\1/")
          if pod trunk push Card-iOS.podspec --allow-warnings; then
            exit 0
          fi
          echo "pod trunk push failed, checking whether $VERSION was registered anyway"
          for attempt in 1 2 3 4 5; do
            if pod trunk info Card-iOS | grep -qE "^\s+- $VERSION \("; then
              echo "Card-iOS $VERSION is on trunk, treating the push as successful"
              exit 0
            fi
            sleep 30
          done
          echo "Card-iOS $VERSION is not on trunk"
          exit 1
